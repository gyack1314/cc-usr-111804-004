<!doctype html><html lang="zh"><meta charset="utf-8"><title>测试报告演练页</title>
<body><h1>测试报告资料</h1><button type="button" id="switch">切换</button>
<div id="card">原配置报告</div><pre id="state"></pre>
<script>
let state={"scope": "灵巧手配置 A", "card_scope": "灵巧手配置 A", "phase": "loaded", "card": {"kind": "hand_config", "id": "hand_config-A", "revision": "v1", "configuration": "灵巧手配置 A", "hand_model": "H-1", "page_scope": "灵巧手配置 A"}};
const next={"scope": "灵巧手配置 B", "card_scope": "灵巧手配置 B", "phase": "loaded", "card": {"kind": "test_card", "id": "test_card-A", "revision": "v2", "configuration": "灵巧手配置 B", "card_scope": "灵巧手配置 B", "report_no": "H-R1"}};
const show=()=>document.querySelector('#state').textContent=JSON.stringify(state);
show();
document.querySelector('#switch').onclick=()=>{
  state.scope=next.scope; state.phase='pending'; show();
  setTimeout(()=>{state=next;
    document.querySelector('#card').textContent="新配置报告"; show();},300);
};
</script></body></html>
